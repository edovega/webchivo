name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        component: [app, db, reviewer]
    steps:
      - uses: actions/checkout@v4

      - name: Require the flags
        env:
          FLAG_01: ${{ secrets.FLAG_01 }}
          FLAG_02: ${{ secrets.FLAG_02 }}
          FLAG_03: ${{ secrets.FLAG_03 }}
          FLAG_04: ${{ secrets.FLAG_04 }}
          FLAG_05: ${{ secrets.FLAG_05 }}
          FLAG_06: ${{ secrets.FLAG_06 }}
          FLAG_07: ${{ secrets.FLAG_07 }}
          FLAG_08: ${{ secrets.FLAG_08 }}
        run: |
          missing=0
          for name in FLAG_01 FLAG_02 FLAG_03 FLAG_04 FLAG_05 FLAG_06 FLAG_07 FLAG_08; do
            if [ -z "${!name}" ]; then
              echo "Secret ${name} is empty" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Write the flags file
        id: flags
        env:
          FLAG_01: ${{ secrets.FLAG_01 }}
          FLAG_02: ${{ secrets.FLAG_02 }}
          FLAG_03: ${{ secrets.FLAG_03 }}
          FLAG_04: ${{ secrets.FLAG_04 }}
          FLAG_05: ${{ secrets.FLAG_05 }}
          FLAG_06: ${{ secrets.FLAG_06 }}
          FLAG_07: ${{ secrets.FLAG_07 }}
          FLAG_08: ${{ secrets.FLAG_08 }}
        run: |
          umask 077
          file="${RUNNER_TEMP}/ctf_flags.env"
          : > "$file"
          for name in FLAG_01 FLAG_02 FLAG_03 FLAG_04 FLAG_05 FLAG_06 FLAG_07 FLAG_08; do
            printf '%s=%s\n' "$name" "${!name}" >> "$file"
          done
          chmod 0600 "$file"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Image name
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/cib203-lab-web-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            ctf_flags=${{ steps.flags.outputs.path }}

      - name: Remove the flags file
        if: always()
        run: rm -f "${RUNNER_TEMP}/ctf_flags.env"
