# CIB-203 lab Apache configuration.
ServerName proveedores.lab

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Only the uploads directory honors .htaccess, which turns PHP off there.
<Directory /var/www/html/uploads>
    Options -Indexes
    AllowOverride All
</Directory>

# Access log to stdout, so "docker compose logs app" shows every request.
# The default virtual host logs to ${APACHE_LOG_DIR}/access.log, which the
# php:apache image links to /dev/stdout. Requests outside any virtual host
# go to the same place through this server-level directive.
CustomLog /proc/self/fd/1 combined
